[package]
name = "proxy-reverse"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
hyper = { version = "1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["server", "client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", features = ["http2"] }
rustls = "0.23"
url = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
